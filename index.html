<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界啤酒文化 · World Beer Culture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+SC:wght@300;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#0C0C0C; overflow:hidden; font-family:'Noto Sans SC',sans-serif; color:#F5F2EC; }

  /* 16:9 舞台 */
  #stage {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:#000;
  }
  #screen {
    position:relative;
    width:100vw; height:56.25vw;   /* 16:9 */
    max-height:100vh; max-width:177.78vh;
    overflow:hidden;
    background:#000;
  }

  /* 轮播项 */
  .slide {
    position:absolute; inset:0;
    opacity:0; transition:opacity 1.8s ease-in-out;
    pointer-events:none;
  }
  .slide.active { opacity:1; pointer-events:auto; }
  .slide img, .slide video {
    width:100%; height:100%; object-fit:cover;
    transform:scale(1.08);
    transition:transform 8s linear;
  }
  .slide.active img, .slide.active video { transform:scale(1.18); }

  /* 暗角 + 底部渐变 */
  .vignette {
    position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.55) 100%),
      linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.4) 35%, transparent 65%),
      linear-gradient(to left, rgba(0,0,0,0.5) 0%, transparent 40%);
    z-index:5;
  }

  /* 文字卡片 */
  .caption {
    position:absolute; left:5%; bottom:8%;
    max-width:60%; z-index:10;
    opacity:0; transform:translateY(20px);
    transition:opacity 1.2s ease 0.3s, transform 1.2s ease 0.3s;
  }
  .slide.active .caption { opacity:1; transform:translateY(0); }
  .tag {
    display:inline-flex; align-items:center; gap:12px;
    color:#C48B47; font-family:'Playfair Display',serif;
    font-size:1.1vw; letter-spacing:0.35em; text-transform:uppercase;
    margin-bottom:1.2vw; font-weight:700;
  }
  .tag::before { content:''; width:3vw; height:1px; background:#C48B47; }
  .title {
    font-size:var(--title-size, 64px); font-weight:900; line-height:1.05;
    letter-spacing:0.02em; margin-bottom:1.2vw;
    text-shadow:0 4px 30px rgba(0,0,0,0.8);
  }
  .subtitle {
    font-size:var(--sub-size, 22px); font-weight:300; line-height:1.7;
    color:rgba(245,242,236,0.85); max-width:40vw;
    text-shadow:0 2px 10px rgba(0,0,0,0.8);
  }

  /* Logo */
  .logo {
    position:absolute; z-index:20; padding:1.5vw;
  }
  .logo img { max-height:6vw; max-width:18vw; filter:drop-shadow(0 2px 10px rgba(0,0,0,0.6)); }
  .logo.tl { top:0; left:0; }
  .logo.tr { top:0; right:0; }

  /* 角落文字 */
  .corner {
    position:absolute; bottom:2vw; right:3vw; z-index:20;
    font-size:0.9vw; letter-spacing:0.25em; color:rgba(245,242,236,0.55);
    text-transform:uppercase; font-weight:500;
  }
  .corner.br { bottom:2vw; right:3vw; }
  .corner.bl { bottom:2vw; left:3vw; }

  /* 进度条 - 已隐藏 */
  .progress { display:none; }

  /* 安全区提示 */
  @media (max-aspect-ratio:16/9) {
    #screen { width:177.78vh; height:100vh; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="screen">
    <div id="slides"></div>
    <div class="vignette"></div>
    <div id="logoMount"></div>
    <div id="cornerMount"></div>
    <div class="progress" id="progress"></div>
  </div>
</div>

<script>
let slides = [];
let settings = { logo:{src:'',position:'top-right',visible:false}, cornerText:{text:'',position:'bottom-right',visible:false}, transition:1800 };
let current = 0;
let timer = null;
let progTimer = null;
// 自动计算base路径（兼容GitHub Pages子目录和Vercel根目录）
const BASE = location.pathname.replace(/\/admin.*$/, '').replace(/\/$/, '');
function p(src) {
  if (!src) return src;
  if (src.startsWith('http')) return src;
  if (src.startsWith('/')) return BASE + src;
  return BASE + '/' + src;
}

async function loadConfig() {
  try {
    const [s, st] = await Promise.all([
      fetch(p('content/slides.json') + '?t=' + Date.now(), {cache:'no-store'}).then(r=>r.json()),
      fetch(p('content/settings.json') + '?t=' + Date.now(), {cache:'no-store'}).then(r=>r.json())
    ]);
    slides = (s.slides || s).filter(x => x.enabled !== false);
    settings = st;
    renderShell();
    // 应用标题字号
    const ts = settings.titleSize || 64, ss = settings.subSize || 22;
    document.documentElement.style.setProperty('--title-size', ts + 'px');
    document.documentElement.style.setProperty('--sub-size', ss + 'px');
    if (!document.querySelector('.slide')) renderSlides();
    else refreshSlideContent();
  } catch(e) { console.warn('config reload failed', e); }
}

function renderShell() {
  const lm = document.getElementById('logoMount');
  lm.innerHTML = '';
  if (settings.logo && settings.logo.visible && settings.logo.src) {
    const d = document.createElement('div');
    d.className = 'logo ' + (settings.logo.position === 'top-left' ? 'tl' : 'tr');
    d.innerHTML = `<img src="${p(settings.logo.src)}" alt="logo">`;
    lm.appendChild(d);
  }
  const cm = document.getElementById('cornerMount');
  cm.innerHTML = '';
  if (settings.cornerText && settings.cornerText.visible && settings.cornerText.text) {
    const d = document.createElement('div');
    d.className = 'corner ' + (settings.cornerText.position === 'bottom-left' ? 'bl' : 'br');
    d.textContent = settings.cornerText.text;
    cm.appendChild(d);
  }
}

function renderSlides() {
  const host = document.getElementById('slides');
  host.innerHTML = '';
  slides.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'slide' + (i===0 ? ' active' : '');
    if (s.type === 'video') {
      div.innerHTML = `<video src="${p(s.src)}" muted loop playsinline preload="auto"></video>
        <div class="caption"><div class="tag">${s.tag||''}</div><div class="title">${s.title||''}</div><div class="subtitle">${s.subtitle||''}</div></div>`;
    } else {
      div.innerHTML = `<img src="${p(s.src)}" alt="${s.title||''}">
        <div class="caption"><div class="tag">${s.tag||''}</div><div class="title">${s.title||''}</div><div class="subtitle">${s.subtitle||''}</div></div>`;
    }
    host.appendChild(div);
  });
  go(0);
}

function refreshSlideContent() {
  document.querySelectorAll('.slide').forEach((el, i) => {
    if (!slides[i]) return;
    const s = slides[i];
    const cap = el.querySelector('.caption');
    if (cap) cap.innerHTML = `<div class="tag">${s.tag||''}</div><div class="title">${s.title||''}</div><div class="subtitle">${s.subtitle||''}</div>`;
  });
}

function go(i) {
  clearTimeout(timer);
  clearInterval(progTimer);
  const all = document.querySelectorAll('.slide');
  if (!all.length) return;
  all.forEach(el => el.classList.remove('active'));
  current = (i + slides.length) % slides.length;
  const el = all[current];
  el.classList.add('active');
  const s = slides[current];

  const video = el.querySelector('video');
  if (video) {
    video.currentTime = 0;
    video.play().catch(()=>{});
    video.onended = () => go(current + 1);
    animateProgress(15);
  } else {
    const dur = (s.duration || 6) * 1000;
    animateProgress(dur);
    timer = setTimeout(() => go(current + 1), dur);
  }
}

function animateProgress(ms) {
  const p = document.getElementById('progress');
  p.style.transition = 'none'; p.style.width = '0%';
  requestAnimationFrame(() => {
    p.style.transition = `width ${ms}ms linear`;
    p.style.width = '100%';
  });
}

loadConfig();
setInterval(loadConfig, 20000);
</script>
</body>
</html>
