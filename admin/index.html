<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界啤酒文化 · 后台管理</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:#141414; color:#E8E4DC; padding:24px; line-height:1.6; }
  h1 { font-size:22px; margin-bottom:20px; color:#C48B47; }
  h2 { font-size:16px; margin:24px 0 12px; color:#F5F2EC; border-left:3px solid #C48B47; padding-left:10px; }
  .card { background:#1E1E1E; border-radius:8px; padding:20px; margin-bottom:16px; }
  input, textarea, select {
    width:100%; background:#0C0C0C; border:1px solid #333; color:#E8E4DC;
    padding:8px 10px; border-radius:4px; font-size:14px; font-family:inherit;
  }
  input:focus, textarea:focus { outline:none; border-color:#C48B47; }
  textarea { min-height:60px; resize:vertical; }
  label { display:block; font-size:12px; color:#999; margin:10px 0 4px; }
  button {
    background:#C48B47; color:#0C0C0C; border:none; padding:10px 20px;
    border-radius:4px; font-weight:700; cursor:pointer; font-size:14px; margin-right:8px;
  }
  button:hover { background:#D99B57; }
  button.secondary { background:#333; color:#E8E4DC; }
  button.danger { background:#7a2a2a; }
  .row { display:flex; gap:10px; align-items:center; }
  .slide-item { background:#0C0C0C; border:1px solid #2a2a2a; border-radius:6px; padding:14px; margin-bottom:10px; }
  .slide-item .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .slide-item .head b { color:#C48B47; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .status { padding:10px; border-radius:4px; margin:10px 0; font-size:13px; display:none; }
  .status.ok { display:block; background:#1a3a1a; color:#7f7; }
  .status.err { display:block; background:#3a1a1a; color:#f77; }
  .status.busy { display:block; background:#3a3a1a; color:#ff7; }
  .hidden { display:none; }
  .dropzone { cursor:pointer; display:block; margin-top:8px; border:2px dashed #444; border-radius:6px; padding:14px; text-align:center; color:#888; font-size:13px; transition:border-color .2s; }
  .dropzone:hover { border-color:#C48B47; }
  .dropzone img { max-width:100%; max-height:180px; border-radius:4px; display:block; margin:0 auto; }
  .dropzone .hint { margin-top:8px; color:#C48B47; font-size:12px; }
  a { color:#C48B47; }
  .progress-bar { height:4px; background:#333; border-radius:2px; margin-top:8px; overflow:hidden; }
  .progress-bar > div { height:100%; background:#C48B47; width:0%; transition:width .2s; }
</style>
</head>
<body>
<h1>世界啤酒文化 · 后台管理</h1>

<div id="loginCard" class="card">
  <h2>第一步：连接 GitHub</h2>
  <p style="font-size:13px;color:#aaa;margin-bottom:12px">
    需要一个 GitHub Token（只填一次，存在浏览器里）。
    <a href="https://github.com/settings/tokens/new?scopes=repo&description=beer-admin" target="_blank">点这里生成 Token</a>
    （勾选 repo，拉到底 Generate，复制粘贴）。
  </p>
  <label>GitHub Token</label>
  <input type="password" id="token" placeholder="ghp_xxxxx">
  <div style="margin-top:12px">
    <button onclick="saveToken()">保存并连接</button>
  </div>
</div>

<div id="mainUI" class="hidden">
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <b>已连接：georgezhou2024/beer-screen</b>
      <button class="secondary" onclick="logout()">退出</button>
    </div>
    <div id="status" class="status"></div>
  </div>

  <h2>全局设置（Logo / 角标）</h2>
  <div class="card">
    <div class="grid2">
      <div>
        <label>店铺 Logo（点预览直接换）</label>
        <input type="text" id="logoSrc" placeholder="上传后自动填">
        <label class="dropzone">
          <input type="file" id="logoFile" accept="image/*" style="display:none" onchange="uploadLogo()">
          <span id="logoPreview">＋ 点击上传 Logo</span>
        </label>
      </div>
      <div>
        <label>Logo 位置</label>
        <select id="logoPos">
          <option value="top-right">右上角</option>
          <option value="top-left">左上角</option>
        </select>
        <label style="margin-top:10px"><input type="checkbox" id="logoVis" style="width:auto"> 显示 Logo</label>
      </div>
    </div>
    <hr style="border-color:#2a2a2a;margin:16px 0">
    <label>角落小字内容</label>
    <input type="text" id="cornerText">
    <div class="grid2" style="margin-top:10px">
      <div>
        <label>位置</label>
        <select id="cornerPos">
          <option value="bottom-right">右下角</option>
          <option value="bottom-left">左下角</option>
        </select>
      </div>
      <div>
        <label>&nbsp;</label>
        <label><input type="checkbox" id="cornerVis" style="width:auto"> 显示角落文字</label>
      </div>
    </div>
  </div>

  <h2>轮播素材（点预览图直接换图）</h2>
  <div id="slidesHost"></div>
  <button class="secondary" onclick="addSlide()">+ 新增一条</button>

  <div style="margin-top:24px">
    <button onclick="saveAll()">保存全部修改</button>
    <button class="secondary" onclick="loadAll()">重新加载</button>
  </div>
</div>

<script>
const REPO = "georgezhou2024/beer-screen";
let token = localStorage.getItem("beer_token") || "";
let slides = [];
let settings = { logo:{src:"",position:"top-right",visible:false}, cornerText:{text:"",position:"bottom-right",visible:false} };
const BASE = location.pathname.replace(/\/admin.*$/, '').replace(/\/$/, '');
function p(src) {
  if (!src) return "";
  if (src.startsWith('http')) return src;
  if (src.startsWith('/')) return location.origin + src;
  return location.origin + BASE + '/' + src;
}

function showStatus(msg, type="ok") {
  const s = document.getElementById("status");
  s.textContent = msg;
  s.className = "status " + type;
  if (type !== "busy") setTimeout(()=>{ s.className="status"; }, 5000);
}

function saveToken() {
  token = document.getElementById("token").value.trim();
  if (!token) { showStatus("请先填 Token", "err"); return; }
  localStorage.setItem("beer_token", token);
  enterMain();
}
function logout() { localStorage.removeItem("beer_token"); location.reload(); }
function enterMain() {
  document.getElementById("loginCard").classList.add("hidden");
  document.getElementById("mainUI").classList.remove("hidden");
  loadAll();
}

async function api(path, method="GET", body=null) {
  const r = await fetch("https://api.github.com" + path, {
    method,
    headers: {
      "Authorization": "token " + token,
      "Accept": "application/vnd.github.v3+json"
    },
    body: body ? JSON.stringify(body) : null
  });
  if (!r.ok) {
    const t = await r.text();
    throw new Error("GitHub " + r.status + ": " + t);
  }
  return r.json();
}

function b64encode(buf) {
  let bin = '';
  new Uint8Array(buf).forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}

async function getFileSha(path) {
  const f = await api("/repos/" + REPO + "/contents/" + path + "?ref=main");
  return f.sha;
}

async function loadAll() {
  try {
    showStatus("加载中...", "busy");
    // slides
    const sf = await api("/repos/" + REPO + "/contents/content/slides.json?ref=main");
    const sBytes = Uint8Array.from(atob(sf.content.replace(/\n/g,'')), c => c.charCodeAt(0));
    const sData = JSON.parse(new TextDecoder('utf-8').decode(sBytes));
    slides = sData.slides || sData;
    // settings
    const stf = await api("/repos/" + REPO + "/contents/content/settings.json?ref=main");
    const stBytes = Uint8Array.from(atob(stf.content.replace(/\n/g,'')), c => c.charCodeAt(0));
    settings = JSON.parse(new TextDecoder('utf-8').decode(stBytes));
    renderForm();
    showStatus("加载成功，共 " + slides.length + " 条素材");
  } catch(e) { showStatus("加载失败: " + e.message, "err"); }
}

function renderForm() {
  document.getElementById("logoSrc").value = settings.logo.src || "";
  document.getElementById("logoPos").value = settings.logo.position || "top-right";
  document.getElementById("logoVis").checked = !!settings.logo.visible;
  document.getElementById("cornerText").value = settings.cornerText.text || "";
  document.getElementById("cornerPos").value = settings.cornerText.position || "bottom-right";
  document.getElementById("cornerVis").checked = !!settings.cornerText.visible;
  const lp = document.getElementById("logoPreview");
  if (settings.logo.src) {
    lp.innerHTML = `<img src="${p(settings.logo.src)}"><div class="hint">点击更换 Logo</div>`;
  } else {
    lp.innerHTML = "＋ 点击上传 Logo（透明PNG最佳）";
  }

  const host = document.getElementById("slidesHost");
  host.innerHTML = "";
  slides.forEach((s, i) => {
    const div = document.createElement("div");
    div.className = "slide-item";
    const isImg = s.src && s.src.match(/\.(jpg|jpeg|png|webp|gif)$/i);
    div.innerHTML = `
      <div class="head">
        <b>#${i+1} ${s.title || "(未命名)"}</b>
        <div>
          <button class="secondary" onclick="moveSlide(${i},-1)">↑</button>
          <button class="secondary" onclick="moveSlide(${i},1)">↓</button>
          <button class="danger" onclick="delSlide(${i})">删除</button>
        </div>
      </div>
      <div class="grid2">
        <div>
          <label>类型</label>
          <select onchange="slides[${i}].type=this.value">
            <option value="image" ${s.type==="image"?"selected":""}>图片</option>
            <option value="video" ${s.type==="video"?"selected":""}>视频(MP4)</option>
          </select>
        </div>
        <div>
          <label>停留秒数</label>
          <input type="number" value="${s.duration||6}" onchange="slides[${i}].duration=+this.value">
        </div>
      </div>
      <label>点预览图换照片，或点下面按钮传视频</label>
      <label class="dropzone">
        <input type="file" accept="image/*,video/mp4,video/webm" style="display:none" data-i="${i}">
        ${isImg ? `<img src="${p(s.src)}" style="max-width:100%;max-height:180px;border-radius:4px;display:block;margin:0;"><div class="hint" style="text-align:left;margin-top:8px;">点击更换图片</div>` :
          (s.type==="video" ? `<div style="padding:16px 0;">🎞 当前视频: <span style="color:#C48B47;word-break:break-all;">${s.src||''}</span><div class="hint" style="text-align:left;margin-top:6px;">点击更换视频</div></div>` :
          `<div style="padding:20px 0;">＋ 点击选择图片上传<div class="hint" style="text-align:left;margin-top:6px;">或拖入图片</div></div>`)}
      </label>
      <div class="grid2" style="margin-top:8px">
        <button class="secondary" onclick="document.querySelectorAll('#slidesHost .slide-item')[${i}].querySelector('input[type=file]').click()">📤 上传到GitHub(小文件)</button>
        <button class="secondary" onclick="const u=prompt('粘贴视频/图片链接(R2地址):');if(u){slides[${i}].src=u;slides[${i}].type='video';renderForm()}">🔗 粘贴外部链接(R2大视频)</button>
      </div>
      <label>标题</label>
      <input type="text" value="${s.title||''}" onchange="slides[${i}].title=this.value">
      <label>副标题</label>
      <textarea onchange="slides[${i}].subtitle=this.value">${s.subtitle||''}</textarea>
      <div class="grid2">
        <div><label>标签(金色小字)</label><input type="text" value="${s.tag||''}" onchange="slides[${i}].tag=this.value"></div>
        <div><label>&nbsp;</label><label><input type="checkbox" style="width:auto" ${s.enabled!==false?"checked":""} onchange="slides[${i}].enabled=this.checked"> 启用</label></div>
      </div>
    `;
    // 绑定文件选择
    const fileInput = div.querySelector('input[type=file]');
    fileInput.addEventListener('change', () => uploadFileForSlide(i, fileInput.files[0]));
    host.appendChild(div);
  });
}

function addSlide() {
  slides.push({ id:"slide"+Date.now(), type:"image", src:"", tag:"", title:"新素材", subtitle:"", duration:6, enabled:true });
  renderForm();
}
function delSlide(i) { if(confirm("删除这条？")) { slides.splice(i,1); renderForm(); } }
function moveSlide(i, d) {
  const j = i+d;
  if (j<0 || j>=slides.length) return;
  [slides[i],slides[j]] = [slides[j],slides[i]];
  renderForm();
}

async function uploadFileForSlide(i, file) {
  if (!file) return;
  // 立即显示本地预览，不等上传
  const reader = new FileReader();
  reader.onload = (e) => {
    const imgs = document.querySelectorAll("#slidesHost .slide-item")[i].querySelectorAll("img");
    if (imgs[0]) imgs[0].src = e.target.result;
  };
  reader.readAsDataURL(file);

  showStatus("上传中: " + file.name, "busy");
  try {
    const path = "assets/uploads/" + Date.now() + "-" + file.name.replace(/[^\w.\-]/g,"_");
    const buf = await file.arrayBuffer();
    await api("/repos/"+REPO+"/contents/"+path, "PUT", {
      message: "upload: " + file.name,
      content: b64encode(buf)
    });
    slides[i].src = path;
    // 预览用 GitHub raw URL，立即可访问，不用等 Vercel 部署
    const rawUrl = "https://raw.githubusercontent.com/" + REPO + "/main/" + path;
    renderForm();
    // renderForm后把刚上传的图换成raw URL预览
    const imgEl = document.querySelectorAll("#slidesHost .slide-item")[i].querySelector("img");
    if (imgEl) imgEl.src = rawUrl;
    showStatus("✅ 上传成功！点底部「保存全部修改」生效");
  } catch(e) { showStatus("上传失败: " + e.message, "err"); }
}

async function uploadLogo() {
  const f = document.getElementById("logoFile").files[0];
  if (!f) return;
  // 立即本地预览
  const reader = new FileReader();
  reader.onload = (e) => {
    document.getElementById("logoPreview").innerHTML = `<img src="${e.target.result}" style="max-height:60px;"><div class="hint">上传中...</div>`;
  };
  reader.readAsDataURL(f);

  showStatus("上传 Logo 中...", "busy");
  try {
    const path = "assets/uploads/logo-" + Date.now() + "." + f.name.split('.').pop().toLowerCase();
    const buf = await f.arrayBuffer();
    await api("/repos/"+REPO+"/contents/"+path, "PUT", {
      message: "upload logo", content: b64encode(buf)
    });
    settings.logo.src = path;
    renderForm();
    const rawUrl = "https://raw.githubusercontent.com/" + REPO + "/main/" + path;
    document.getElementById("logoPreview").innerHTML = `<img src="${rawUrl}" style="max-height:60px;"><div class="hint">点击更换 Logo</div>`;
    showStatus("✅ Logo 上传成功！点底部「保存全部修改」生效");
  } catch(e) { showStatus("Logo 上传失败: " + e.message, "err"); }
}

async function saveFile(path, dataObj, sha) {
  const enc = new TextEncoder();
  const bytes = enc.encode(JSON.stringify(dataObj, null, 2));
  let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
  try {
    await api("/repos/"+REPO+"/contents/"+path, "PUT", {
      message: "update " + path,
      content: btoa(bin),
      sha: sha
    });
  } catch(e) {
    // 409冲突：重新拉sha重试一次
    if (e.message.includes("409")) {
      showStatus("冲突，自动重试...", "busy");
      const newSha = await getFileSha(path);
      await api("/repos/"+REPO+"/contents/"+path, "PUT", {
        message: "update " + path,
        content: btoa(bin),
        sha: newSha
      });
    } else {
      throw e;
    }
  }
}

async function saveAll() {
  try {
    showStatus("保存中...", "busy");
    // 先收集表单
    settings.logo.src = document.getElementById("logoSrc").value;
    settings.logo.position = document.getElementById("logoPos").value;
    settings.logo.visible = document.getElementById("logoVis").checked;
    settings.cornerText.text = document.getElementById("cornerText").value;
    settings.cornerText.position = document.getElementById("cornerPos").value;
    settings.cornerText.visible = document.getElementById("cornerVis").checked;

    // 重新拉最新sha，避免409冲突
    const sSha = await getFileSha("content/slides.json");
    const stSha = await getFileSha("content/settings.json");

    await saveFile("content/settings.json", settings, stSha);
    await saveFile("content/slides.json", {slides: slides}, sSha);

    showStatus("✅ 全部保存成功！Vercel 正在部署，约30秒后前台自动更新");
  } catch(e) {
    showStatus("保存失败: " + e.message, "err");
  }
}

if (token) enterMain();
</script>
</body>
</html>
